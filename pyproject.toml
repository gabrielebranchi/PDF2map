[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2map"
version = "0.1.0"
description = "Turn PDFs into interactive concept maps locally with Ollama"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pymupdf>=1.24", "requests>=2.31"]

[project.optional-dependencies]
ui = ["streamlit>=1.35"]
dev = ["pytest"]

[project.scripts]
pdf2map = "pdf2map.cli:main"

[tool.setuptools]
packages = ["pdf2map"]
